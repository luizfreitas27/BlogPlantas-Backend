# ============================================
# DOCKER COMPOSE
# ============================================
# Orquestra múltiplos containers e simplifica configuração
# Em vez de comandos docker longos, você usa: docker compose up

# Versão do formato (3.8 é estável e amplamente suportada)
version: '3.8'

services:
  # ==========================================
  # API - Nossa aplicação .NET
  # ==========================================
  api:
    # Nome do container (opcional, mas útil para identificar)
    container_name: blogplantas-api

    # BUILD: Constrói a imagem a partir do Dockerfile
    build:
      context: .          # Diretório base (onde está o Dockerfile)
      dockerfile: Dockerfile

    # PORTS: Mapeia porta do host para o container
    # Formato: "PORTA_HOST:PORTA_CONTAINER"
    # Acesse em http://localhost:5000
    ports:
      - "5000:8080"

    # ENVIRONMENT: Variáveis de ambiente
    # É aqui que você configura segredos em produção!
    # Sobrescrevem o appsettings.json
    environment:
      # Ambiente de execução (Development, Staging, Production)
      - ASPNETCORE_ENVIRONMENT=Production

      # Connection string - use __ para separar níveis do JSON
      # Em produção, NUNCA deixe a senha aqui - use .env ou secrets
      - ConnectionStrings__DefaultConnection=Host=db.egapgdpextrykcuxvhke.supabase.co;Database=postgres;Username=postgres;Password=${DB_PASSWORD};SSL Mode=Require;Trust Server Certificate=true

    # RESTART: Política de reinício
    # - no: nunca reinicia
    # - always: sempre reinicia
    # - on-failure: reinicia só se falhar
    # - unless-stopped: sempre, exceto se você parar manualmente
    restart: unless-stopped

    # HEALTHCHECK: Verifica se a aplicação está saudável
    # Docker pode reiniciar containers não saudáveis automaticamente
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s      # Verifica a cada 30 segundos
      timeout: 10s       # Timeout de 10 segundos
      retries: 3         # 3 falhas = unhealthy
      start_period: 40s  # Espera 40s antes de começar a verificar

# ============================================
# NETWORKS (opcional, mas boa prática)
# ============================================
# Redes isolam comunicação entre containers
# Se adicionar mais serviços (Redis, etc), eles se comunicam pela rede
networks:
  default:
    name: blogplantas-network